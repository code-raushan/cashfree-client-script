<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashfree Subscription Checkout</title>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        /* Optional: Basic styling for the error message */
        #paymentMessage {
            margin-top: 15px;
            font-weight: bold;
        }
        .alert-danger {
            color: red;
        }
        .alert-success { /* Although not used in snippet, good to have */
            color: green;
        }
    </style>
</head>
<body>
    <h1>Cashfree Subscription Checkout</h1>
    <form id="subscription-form">
        <label for="subsSessionId">Subscription Session ID:</label>
        <input type="text" id="subsSessionId" required style="width: 400px;"><br><br>

        <button type="button" id="subsCheckout">Pay Now</button>
    </form>

    <div id="paymentMessage"></div>

    <script>
        // Get the message element
        const paymentMessage = document.getElementById("paymentMessage");

        // Initialize Cashfree SDK
        const cashfree = Cashfree({
            mode: "sandbox" // Ensure this is "sandbox" for testing
        });

        // Add event listener to the button
        document.getElementById("subsCheckout").addEventListener("click", function(){
            // Clear previous messages and styles
            paymentMessage.innerText = "";
            paymentMessage.classList.remove("alert-danger");
            paymentMessage.classList.remove("alert-success");

            const subsSessionIdValue = document.getElementById("subsSessionId").value;

            if (!subsSessionIdValue) {
                paymentMessage.innerText = "Please enter the Subscription Session ID.";
                paymentMessage.classList.add("alert-danger");
                return;
            }

            console.log("Launching Cashfree subscription checkout with session ID:", subsSessionIdValue);

            // Use subscriptionsCheckout method
            cashfree.subscriptionsCheckout({
                subsSessionId: subsSessionIdValue,
                redirectTarget: "_blank" // Open in new tab
            }).then(function(result){
                if(result.error){
                    console.error("Cashfree subscriptionsCheckout error:", result.error);
                    paymentMessage.innerText = result.error.message; // Use innerText for security
                    paymentMessage.classList.add("alert-danger");
                } else if (result.redirect) {
                    console.log("Cashfree subscriptionsCheckout initiated redirection.");
                    // Handle potential success message or button disabling if needed
                    // Since it redirects, immediate feedback might not be necessary here
                }
            }).catch(function(error) {
                // Catch unexpected errors during the initiation
                console.error("Unexpected error initiating Cashfree subscriptionsCheckout:", error);
                paymentMessage.innerText = "An unexpected error occurred. Please check console.";
                paymentMessage.classList.add("alert-danger");
            });
        });
    </script>
</body>
</html>
